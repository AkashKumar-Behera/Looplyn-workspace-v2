services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: looplyn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: looplyn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Looplyn Hono Backend Server
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: looplyn-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/looplyn
      JWT_SECRET: super_secret_looplyn_jwt_2026_key_production
      SUPER_ADMIN_EMAIL: admin@looplyn.tech
      SUPER_ADMIN_PASSWORD: SuperAdminSecretPassword123!
      FRONTEND_URL: https://workspace.looplyn.tech
    depends_on:
      - postgres

volumes:
  pgdata:
